<!DOCTYPE html>
<html lang="lv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Snake: Light & Dark — spēles līderu tabula, noteikumi un spēlētāju statistika."
    />
    <title>{{ title or 'Snake leaderboard' }}</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%8D%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}" />
  </head>
  <body>
    <!--
      "skip-link" ir slepena saite, kas ļauj tastatūras lietotājam
      uzreiz pāriet uz galveno saturu, nevis ritināt visu lapu.
    -->
    <a class="skip-link" href="#main-content">Pāriet uz saturu</a>

    <!--
      Visas lapas kopīgā galvene: logo un navigācija. Šeit ir "site-header",
      kas paliek vienāda visās lapās, bet saturs tiek mainīts ar Jinja blokiem.
    -->
    <header class="site-header" aria-label="Galvenā navigācija">
      <a href="{{ url_for('home_page') }}" class="brand" aria-label="Atgriezties uz līderu tabulu">
        <span class="brand-mark">SNAKE</span>
        <span class="brand-subtitle">LIGHT / DARK</span>
      </a>

      <nav class="site-nav" aria-label="Navigācijas saites">
        <a href="{{ url_for('home_page') }}" class="nav-link">Līderi</a>
        <a href="{{ url_for('rules_page') }}" class="nav-link">Noteikumi</a>
      </nav>
    </header>

    <!--
      "main" ir galvenais saturs. Šeit tiek ielādēts katras lapas unikālais saturs,
      ko nosaka "{% block content %}" no konkrētā HTML faila.
    -->
    <main id="main-content" class="page-shell">
      {% block content %}{% endblock %}
    </main>

    <!--
      Footer ir zemākā daļa, kurā parasti tiek rādīts autora vai projekta apraksts.
      Šeit ir vienkāršs teksts, kas neietekmē galveno funkcionalitāti.
    -->
    <footer class="site-footer">
      <p>Snake: Light & Dark · FastAPI + Jinja2</p>
    </footer>
  </body>
</html>
